<svg viewBox="0 0 940 580" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Pipeline RAG sur le RGPD</title>
<desc>Deux phases : indexation (HTML, parsing, decoupage, ChromaDB) faite une fois, puis interrogation (question, routeur, multi-query, recherche, parent recovery, rerank, prompt, Mistral) a chaque question.</desc>
<defs>
<marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0,0 L7,3 L0,6 Z" fill="#9ca3af"/>
</marker>
</defs>
<style>
.box{fill:#ffffff;stroke:#d4d4d8;stroke-width:1.5;}
.idx{fill:#eef3fe;stroke:#3b6ef0;stroke-width:1.5;}
.router{fill:#fff7ed;stroke:#ea9a3e;stroke-width:1.5;}
.solid{fill:#0e9f6e;stroke:#0e9f6e;}
.note{fill:#fbfaf8;stroke:#ea9a3e;stroke-width:1.3;stroke-dasharray:5 4;}
.lbl{font-size:13px;font-weight:600;fill:#1f2328;}
.lblw{font-size:14px;font-weight:600;fill:#ffffff;}
.sub{font-size:10.5px;fill:#6b7280;}
.subw{font-size:10.5px;fill:#dcf2e7;}
.sec{font-size:12.5px;font-weight:700;}
.title{font-size:21px;font-weight:700;fill:#1f2328;}
.subt{font-size:12px;fill:#6b7280;}
.arrow{stroke:#9ca3af;stroke-width:2;fill:none;marker-end:url(#ah);}
.darrow{stroke:#9ca3af;stroke-width:1.6;fill:none;stroke-dasharray:4 4;marker-end:url(#ah);}
.leg{font-size:11px;fill:#6b7280;}
</style>

<rect x="0" y="0" width="940" height="580" fill="#ffffff"/>

<text x="30" y="30" class="title">Pipeline RAG — questions/réponses sur le RGPD</text>
<text x="30" y="50" class="subt">De la question à une réponse fondée sur les vrais articles (anti-hallucination)</text>

<rect x="690" y="16" width="13" height="13" rx="3" class="idx"/>
<text x="709" y="27" class="leg">Indexation</text>
<rect x="790" y="16" width="13" height="13" rx="3" class="solid"/>
<text x="809" y="27" class="leg">Interrogation</text>

<text x="30" y="84" class="sec" fill="#1d4ed8">1 · INDEXATION — une seule fois (hors-ligne)</text>
<rect x="30"  y="96" width="175" height="52" rx="8" class="idx"/>
<text x="117" y="118" text-anchor="middle" class="lbl">HTML RGPD</text>
<text x="117" y="135" text-anchor="middle" class="sub">texte officiel</text>
<rect x="262" y="96" width="175" height="52" rx="8" class="idx"/>
<text x="349" y="118" text-anchor="middle" class="lbl">Parsing</text>
<text x="349" y="135" text-anchor="middle" class="sub">BeautifulSoup</text>
<rect x="494" y="96" width="175" height="52" rx="8" class="idx"/>
<text x="581" y="118" text-anchor="middle" class="lbl">Découpage</text>
<text x="581" y="135" text-anchor="middle" class="sub">chunks 300 + parents</text>
<rect x="726" y="96" width="175" height="52" rx="8" class="idx"/>
<text x="813" y="118" text-anchor="middle" class="lbl">ChromaDB</text>
<text x="813" y="135" text-anchor="middle" class="sub">embeddings MiniLM</text>
<path class="arrow" d="M205,122 L260,122"/>
<path class="arrow" d="M437,122 L492,122"/>
<path class="arrow" d="M669,122 L724,122"/>

<line x1="30" y1="172" x2="901" y2="172" stroke="#e5e7eb" stroke-width="1"/>

<text x="30" y="196" class="sec" fill="#047857">2 · INTERROGATION — à chaque question</text>

<rect x="30"  y="208" width="175" height="54" rx="8" class="solid"/>
<text x="117" y="231" text-anchor="middle" class="lblw">Question</text>
<text x="117" y="248" text-anchor="middle" class="subw">de l'utilisateur</text>
<rect x="262" y="208" width="175" height="54" rx="8" class="router"/>
<text x="349" y="231" text-anchor="middle" class="lbl">smart_rag</text>
<text x="349" y="248" text-anchor="middle" class="sub">routeur intelligent</text>
<rect x="494" y="208" width="175" height="54" rx="8" class="box"/>
<text x="581" y="231" text-anchor="middle" class="lbl">1 · Multi-query</text>
<text x="581" y="248" text-anchor="middle" class="sub">Mistral → 4 variantes</text>
<rect x="726" y="208" width="175" height="54" rx="8" class="box"/>
<text x="813" y="231" text-anchor="middle" class="lbl">2 · Recherche</text>
<text x="813" y="248" text-anchor="middle" class="sub">ChromaDB · k=6</text>
<path class="arrow" d="M205,235 L260,235"/>
<path class="arrow" d="M437,235 L492,235"/>
<path class="arrow" d="M669,235 L724,235"/>

<path class="darrow" d="M813,150 L813,206"/>
<text x="822" y="183" class="leg">chunks</text>

<path class="arrow" d="M813,262 L813,338"/>

<rect x="726" y="340" width="175" height="54" rx="8" class="box"/>
<text x="813" y="363" text-anchor="middle" class="lbl">3 · Parent recovery</text>
<text x="813" y="380" text-anchor="middle" class="sub">chunks → articles ≤8</text>
<rect x="494" y="340" width="175" height="54" rx="8" class="box"/>
<text x="581" y="363" text-anchor="middle" class="lbl">4 · Rerank</text>
<text x="581" y="380" text-anchor="middle" class="sub">cross-encoder → top 3</text>
<rect x="262" y="340" width="175" height="54" rx="8" class="box"/>
<text x="349" y="363" text-anchor="middle" class="lbl">5 · Prompt</text>
<text x="349" y="380" text-anchor="middle" class="sub">anti-hallucination</text>
<rect x="30"  y="340" width="175" height="54" rx="8" class="solid"/>
<text x="117" y="363" text-anchor="middle" class="lblw">6 · Mistral</text>
<text x="117" y="380" text-anchor="middle" class="subw">génère la réponse</text>
<path class="arrow" d="M726,367 L671,367"/>
<path class="arrow" d="M494,367 L439,367"/>
<path class="arrow" d="M262,367 L207,367"/>

<path class="arrow" d="M117,394 L117,440"/>
<rect x="30" y="442" width="370" height="48" rx="8" class="solid"/>
<text x="215" y="465" text-anchor="middle" class="lblw">Réponse structurée + sources + métriques</text>
<text x="215" y="481" text-anchor="middle" class="subw">5 sections · articles cités · latence</text>

<rect x="450" y="430" width="451" height="72" rx="8" class="note"/>
<text x="466" y="452" class="lbl" fill="#b45309">↳ Raccourci du routeur (sans LLM)</text>
<text x="466" y="472" class="sub">Si la question vise un article précis (« article 17 ») ou un chapitre,</text>
<text x="466" y="488" class="sub">réponse directe par métadonnées — sans recherche vectorielle ni génération.</text>
</svg>
